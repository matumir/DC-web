name: Build y Deploy a Hostinger

# Compila el sitio React (Vite build + pre-render) y sube el dist/ a Hostinger por FTP.
# Se dispara en cada push a MAIN2, o manualmente desde la pestaña Actions.

on:
  push:
    branches: [MAIN2]
  workflow_dispatch:

# Evita deploys pisándose si hacés varios push seguidos: cancela el anterior en curso.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-version/package-lock.json

      - name: Instalar dependencias
        working-directory: react-version
        run: npm ci

      - name: Instalar Chromium para el pre-render
        working-directory: react-version
        run: npx playwright install --with-deps chromium

      - name: Build (Vite + sitemap)
        working-directory: react-version
        run: npm run build

      - name: Pre-render de rutas a HTML estático
        working-directory: react-version
        run: npm run prerender

      - name: Deploy a Hostinger por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: react-version/dist/
          # La cuenta FTP está rooteada en public_html (Directorio: .../public_html),
          # así que para el FTP la raíz "/" YA es public_html.
          server-dir: /
